server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # expo-router สร้างไฟล์ .html แยกต่อ route (index.html, explore.html)
    # จึงต้องลอง $uri.html ก่อน แล้วค่อยตกไป index.html เป็นทางสุดท้าย
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ไฟล์ bundle มี hash อยู่ในชื่ออยู่แล้ว แคชยาวได้ปลอดภัย
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ห้ามแคช index.html ไม่งั้นผู้ใช้จะค้างอยู่เวอร์ชันเก่าหลัง deploy ใหม่
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
